<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
  <title id="title">Srinath Gaddam — AI and Data Science Developer</title>
  <desc id="desc">A dark telemetry-inspired profile banner with purple and cyan accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.55" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#071521"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="purpleGlow">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#64748B" stroke-width="1" stroke-opacity="0.12"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="460" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="460" rx="28" fill="url(#grid)"/>
  <circle cx="1180" cy="40" r="370" fill="url(#purpleGlow)"/>
  <circle cx="1320" cy="400" r="320" fill="url(#cyanGlow)"/>
  <path d="M0 438 C280 390 480 478 760 420 S1160 365 1400 410" fill="none" stroke="url(#accent)" stroke-opacity="0.2" stroke-width="2"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(72 58)">
      <rect width="62" height="62" rx="17" fill="url(#accent)"/>
      <text x="31" y="41" text-anchor="middle" font-size="25" font-weight="800" fill="#FFFFFF">SG</text>
      <text x="82" y="24" font-size="16" font-weight="700" letter-spacing="3" fill="#94A3B8">COMPUTER SCIENCE · HYDERABAD</text>
      <text x="82" y="50" font-size="17" fill="#CBD5E1">Learning in public. Building with purpose.</text>
    </g>

    <text x="72" y="210" font-size="78" font-weight="800" letter-spacing="-2" fill="#F8FAFC">Srinath <tspan fill="url(#accent)">Gaddam</tspan></text>
    <text x="76" y="260" font-size="27" font-weight="700" letter-spacing="4" fill="#E2E8F0">AI &amp; DATA SCIENCE DEVELOPER</text>
    <text x="76" y="305" font-size="21" fill="#94A3B8">Machine Learning · Analytics · Intelligent Workflows</text>

    <g transform="translate(76 365)">
      <circle cx="8" cy="-6" r="7" fill="#34D399" filter="url(#softGlow)"/>
      <text x="28" y="0" font-size="16" font-weight="700" letter-spacing="2" fill="#A7F3D0">OPEN TO INTERNSHIPS &amp; COLLABORATIONS</text>
    </g>

    <g transform="translate(900 82)">
      <rect width="422" height="278" rx="25" fill="#0B1220" fill-opacity="0.86" stroke="#8B5CF6" stroke-opacity="0.42"/>
      <text x="28" y="39" font-size="14" font-weight="700" letter-spacing="2.5" fill="#94A3B8">BUILD / MEASURE / ITERATE</text>
      <circle cx="380" cy="32" r="5" fill="#22D3EE"/>

      <g stroke="#334155" stroke-opacity="0.48">
        <path d="M28 82 H394 M28 124 H394 M28 166 H394"/>
        <path d="M72 62 V178 M158 62 V178 M244 62 V178 M330 62 V178"/>
      </g>
      <path d="M30 160 C70 156 78 126 112 133 S165 153 196 112 S248 104 274 88 S328 107 390 55" fill="none" stroke="#22D3EE" stroke-opacity="0.2" stroke-width="12" filter="url(#softGlow)"/>
      <path d="M30 160 C70 156 78 126 112 133 S165 153 196 112 S248 104 274 88 S328 107 390 55" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
      <g fill="#0B1220" stroke="#A78BFA" stroke-width="3">
        <circle cx="112" cy="133" r="6"/><circle cx="196" cy="112" r="6"/><circle cx="274" cy="88" r="6"/><circle cx="390" cy="55" r="6"/>
      </g>

      <g transform="translate(28 207)" font-size="13" font-weight="700" letter-spacing="1.5">
        <rect width="104" height="42" rx="12" fill="#111827" stroke="#334155"/>
        <text x="52" y="27" text-anchor="middle" fill="#C4B5FD">DATA</text>
        <path d="M112 21 H132" stroke="#475569" stroke-width="2"/>
        <path d="M127 16 L133 21 L127 26" fill="none" stroke="#475569" stroke-width="2"/>
        <rect x="142" width="104" height="42" rx="12" fill="#111827" stroke="#334155"/>
        <text x="194" y="27" text-anchor="middle" fill="#C4B5FD">MODEL</text>
        <path d="M254 21 H274" stroke="#475569" stroke-width="2"/>
        <path d="M269 16 L275 21 L269 26" fill="none" stroke="#475569" stroke-width="2"/>
        <rect x="284" width="110" height="42" rx="12" fill="#111827" stroke="#22D3EE" stroke-opacity="0.6"/>
        <text x="339" y="27" text-anchor="middle" fill="#67E8F9">IMPACT</text>
      </g>
    </g>
  </g>
</svg>
